apiVersion: v1
kind: Service
metadata:
  name: vco-postgres
  namespace: infra-ops
spec:
  clusterIP: None          # headless — StatefulSet cần Service headless để cấp DNS ổn định
  selector:
    app: vco-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vco-postgres
  namespace: infra-ops
spec:
  serviceName: vco-postgres
  replicas: 1
  selector:
    matchLabels:
      app: vco-postgres
  template:
    metadata:
      labels:
        app: vco-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: vco-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: vco-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: vco-secrets, key: POSTGRES_DB } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        # Bỏ trống storageClassName để dùng StorageClass mặc định của cụm KubeSphere.
        # Kiểm tra các lựa chọn hiện có bằng: kubectl get storageclass
        # Nếu cần chỉ định rõ, thêm ví dụ: storageClassName: "csi-qingcloud" / "local" / "nfs-client"...
        resources:
          requests:
            storage: 10Gi
