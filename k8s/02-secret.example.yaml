# Chỉ là TEMPLATE — sao chép thành `02-secret.yaml` (đã có trong .gitignore, sẽ
# KHÔNG commit vào git), điền giá trị thật rồi mới `kubectl apply -f k8s/02-secret.yaml`.
#
# Cách khác an toàn hơn (không lưu secret ra file lúc nào, kể cả trên đĩa của bạn):
#   kubectl create secret generic vco-secrets -n vmware-capacity-ops \
#     --from-literal=POSTGRES_USER=vmware_app \
#     --from-literal=POSTGRES_PASSWORD='<mật khẩu Postgres>' \
#     --from-literal=POSTGRES_DB=vmware_capacity_ops \
#     --from-literal=DATABASE_URL='postgresql+psycopg2://vmware_app:<CÙNG mật khẩu Postgres ở trên>@vco-postgres:5432/vmware_capacity_ops' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_PASSWORD='<mật khẩu đăng nhập admin>' \
#     --from-literal=VCENTER_1_PASSWORD='<mật khẩu infra.mon trên vCenter 1>' \
#     --from-literal=VCENTER_2_PASSWORD='<mật khẩu infra.mon trên vCenter 2>' \
#     --from-literal=VCENTER_3_PASSWORD='<mật khẩu infra.mon trên vCenter 3>' \
#     --from-literal=VCENTER_4_PASSWORD='<mật khẩu infra.mon trên vCenter 4>'
#
# LƯU Ý: DATABASE_URL phải khớp CHÍNH XÁC với POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB
# ở trên — Kubernetes không tự nội suy biến như docker-compose.yml, đây là chuỗi tĩnh.
apiVersion: v1
kind: Secret
metadata:
  name: vco-secrets
  namespace: vmware-capacity-ops
type: Opaque
stringData:
  POSTGRES_USER: "vmware_app"
  POSTGRES_PASSWORD: "change-me-strong-password"
  POSTGRES_DB: "vmware_capacity_ops"

  # Phải khớp user/password/db ở trên + tên Service Postgres (vco-postgres, port 5432)
  DATABASE_URL: "postgresql+psycopg2://vmware_app:change-me-strong-password@vco-postgres:5432/vmware_capacity_ops"

  JWT_SECRET: "change-me-to-a-long-random-string"
  ADMIN_PASSWORD: "change-me-strong-password"

  VCENTER_1_PASSWORD: "change-me"
  VCENTER_2_PASSWORD: "change-me"
  VCENTER_3_PASSWORD: "change-me"
  VCENTER_4_PASSWORD: "change-me"
